<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients mimicking the 3D look in the image -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003882"/>
      <stop offset="100%" stop-color="#001740"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left A Symbol consisting of overlapping 3D shapes representing A and a star -->
  <g transform="translate(10, 10)">
    <!-- Base dark lines -->
    <path d="M 60 10 L 15 95" stroke="url(#darkBlue)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)" />
    <path d="M 60 10 L 105 95" stroke="url(#darkBlue)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)" />
    <!-- Center swish (the star arm) -->
    <path d="M 10 70 C 40 70 50 60 110 30" stroke="url(#cyanAccent)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" fill="none" />
    <path d="M 20 85 C 45 85 55 75 105 45" stroke="url(#blueGlow)" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- Three dots / nodes on the left representing IT/network -->
    <circle cx="20" cy="55" r="5" fill="#00d2ff" filter="url(#shadow)" />
    <circle cx="10" cy="70" r="5" fill="#00d2ff" filter="url(#shadow)" />
    <circle cx="15" cy="85" r="5" fill="#4facfe" filter="url(#shadow)" />
    
    <!-- Connecting lines -->
    <line x1="20" y1="55" x2="38" y2="55" stroke="#00d2ff" stroke-width="2" />
    <line x1="10" y1="70" x2="30" y2="70" stroke="#00d2ff" stroke-width="2" />
    <line x1="15" y1="85" x2="35" y2="85" stroke="#4facfe" stroke-width="2" />
  </g>

  <!-- Text Section -->
  <g transform="translate(140, 60)">
    <!-- Axar -->
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#003882" letter-spacing="-1">Axar</text>
    <!-- Tech -->
    <text x="120" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#cyanAccent)" letter-spacing="-1">Tech</text>
    
    <!-- IT Solutions -->
    <text x="2" y="32" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#003882" letter-spacing="3" text-transform="uppercase">IT Solutions</text>
  </g>
</svg>
