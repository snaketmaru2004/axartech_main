<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow effect -->
  <ellipse cx="30" cy="30" rx="25" ry="25" fill="url(#logoGlow)" opacity="0.5"/>
  
  <!-- Stylized A with star element -->
  <g transform="translate(10, 15)" filter="url(#glow)">
    <!-- Main A shape -->
    <path d="M 15 25 L 20 5 L 25 25 M 17 18 L 23 18" 
          stroke="url(#logoGradient)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Star/extension element -->
    <path d="M 26 10 L 28 8 L 30 10 L 28 12 Z" 
          fill="#60a5fa" opacity="0.8"/>
    
    <!-- Glass-like highlight -->
    <path d="M 16 8 L 18 6 L 20 8" 
          stroke="#93c5fd" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- AxarTech text -->
  <g transform="translate(50, 25)">
    <!-- Axar in dark blue -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">Axar</text>
    <!-- Tech in lighter blue -->
    <text x="42" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3b82f6">Tech</text>
  </g>
  
  <!-- IT Solutions tagline -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="8" fill="#60a5fa">IT Solutions</text>
</svg>
